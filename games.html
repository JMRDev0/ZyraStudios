<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZyraStudios / games</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="/img/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/img/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/img/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Zyra Studios" />
    <link rel="manifest" href="/img/favicon/site.webmanifest" />
</head>
<body>
    <div class="terminal-container">
        <div class="back-nav">
            <a href="index.html" class="back-link">&lt;- cd ..</a>
        </div>

        <h1 class="page-title">/games</h1>

        <div class="filter-bar">
            <button class="filter-btn active" data-filter="all">[all]</button>
            <button class="filter-btn" data-filter="pc">[pc]</button>
            <button class="filter-btn" data-filter="mobile">[mobile]</button>
        </div>

        <div class="projects-grid">
            <div class="project-card" data-category="pc mobile">
                <div class="card-top">
                    <h2 class="project-title">Apogee</h2>
                    <div class="tag-row">
                        <span class="project-tag">[pc]</span>
                        <span class="project-tag">[mobile]</span>
                    </div>
                </div>
                <p class="project-desc">
                    Fly, dodge, and weave through a dangerous galaxy full of obstacles!
                </p>
                <div class="project-links">
                    <a href="https://zyrastudios.itch.io/apogee" class="project-link"> Download on Itch.io</a>
                    <a href="https://play.google.com/store/apps/details?id=com.zyrastudios.apogee" class="project-link"> Download on Google Play</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const filterButtons = document.querySelectorAll('.filter-btn');
        const projectCards = document.querySelectorAll('.project-card');

        filterButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                filterButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const filterValue = btn.getAttribute('data-filter');

                projectCards.forEach(card => {
                    const categories = card.getAttribute('data-category').split(' ');
                    const matches = filterValue === 'all' || categories.includes(filterValue);
                    card.style.display = matches ? 'block' : 'none';
                });
            });
        });
    </script>
</body>
</html>
